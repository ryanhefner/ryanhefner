packages:
  - 'apps/*'
  - 'libs/*'

# Quarantine newly published versions for one week. An urgent, reviewed fix can
# bypass the delay with an exact entry such as `package-name@1.2.3` under
# `minimumReleaseAgeExclude`; pnpm prunes the entry when it leaves the lockfile.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # User-approved npm migration on 2026-09-11; only these exact releases bypass the age gate.
  - '@postkit/core@0.2.0'
  - '@postkit/next@0.2.0'
  - '@postkit/react@0.2.0'
  - '@postkit/unfurl@0.2.0'
  # Requested public Chakra Email release; restrict the age exception to 0.2.0.
  - 'chakra-email@0.2.0'
  - '@chakra-email/core@0.2.0'
  - '@chakra-email/preview@0.2.0'
  - '@fontstack/commune--allplay-mono@1.0.0'
  - '@fontstack/commune--allplay-sans@1.0.0'
  - '@fontstack/commune--allplay-serif@1.0.0'

# Reject recent releases whose registry provenance is weaker than earlier
# releases, while avoiding false positives for older packages without metadata.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustLockfile: false

# Keep transitive dependencies on registry/workspace sources and require an
# explicit review before any dependency is permitted to execute install scripts.
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: error
# Keep local and CI installs on the same portable virtual-store layout.
enableGlobalVirtualStore: false

# Less only uses image-size as an optional helper, and this workspace has no
# Less sources. Skip it while every published image-size version is affected
# by the parser DoS advisories.
ignoredOptionalDependencies:
  - image-size

overrides:
  # Converge compatible v5 consumers on the patched release without forcing
  # incompatible v1/v2 consumers across a major-version boundary.
  'brace-expansion@': 5.0.9
  # mdx-bundler only calls the stable `v4()` API; use the patched CJS-compatible
  # UUID line for GHSA-w5hq-g745-h8pq.
  'mdx-bundler@10.1.1>uuid': 11.1.1
  # Preserve each consumer's major version while replacing vulnerable parser
  # and SVG releases held by transitive dependency pins.
  'qs@>=6.0.0 <6.16.0': 6.16.0
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'svgo@>=4.0.0 <4.1.0': 4.1.0
  # Nx 23.2.1 still pins the vulnerable TOML parser; use its patched v1 API.
  'nx@23.2.1>smol-toml': 1.8.0
  # This plugin only uses the named parse() export. TOML v3 has no patched
  # release; narrowly replace this consumer with the CJS-compatible v4 fix.
  'remark-mdx-frontmatter@4.0.0>toml': 4.2.0
  vite: 8.3.0

allowBuilds:
  # These scripts validate or prepare the platform-specific native binaries
  # used by the build toolchain. Changes to this list require review.
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

  # Reviewed but intentionally blocked: watcher only builds when explicitly
  # requested, core-js prints a funding notice, Less attempts to install
  # Playwright browsers, and Nx performs optional post-install setup.
  '@parcel/watcher': false
  core-js: false
  less: false
  nx: false
