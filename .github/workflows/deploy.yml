name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install step
        run: "pnpm install --frozen-lockfile"

      - name: Dependency audit
        run: "pnpm deps:audit"

      - name: Build step
        run: "pnpm exec nx build site --prod && pnpm exec nx run site:postbuild"

      - name: Metadata check
        run: "pnpm exec nx run site:check-metadata"

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "ryanhefner-site"
          entrypoint: "DENO_NEXT_START_DIRECTORY=dist/apps/site/.next; jsr:@deno/nextjs-start/v15"
          root: "."
