name: CI
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install step
        # Fail with an actionable package list before attempting a clean install.
        env:
          FONTSTACK_TOKEN: ${{ secrets.FONTSTACK_TOKEN }}
          # Use a shell-safe name: Linux pnpm launchers can drop URL-shaped env keys.
          PNPM_CONFIG__AUTH: |
            {
              "https://registry.fontstack.com": {
                "@fontstack": {
                  "authToken": ${{ toJSON(secrets.FONTSTACK_TOKEN) }}
                }
              }
            }
        run: |
          node tools/scripts/check-release-dependencies.mjs
          : "${FONTSTACK_TOKEN:?Set the FONTSTACK_TOKEN repository Actions secret}"
          pnpm install --frozen-lockfile

      - name: Dependency audit
        run: 'pnpm deps:audit'

      - name: Build step
        run: 'pnpm exec nx build site --prod'

      - name: Metadata check
        run: 'pnpm exec nx run site:check-metadata'
